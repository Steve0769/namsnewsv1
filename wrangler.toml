# Cloudflare Workers config for a Harbury Builders Club project.
#
# The one-click Deploy button and the advanced setup.sh both fill in the
# database details below automatically. Setting up by hand instead? Rename
# `name` to your own project (keep the `harbury-` prefix) and paste your D1
# `database_id` after creating the database — see the README.

name = "namsnewsv1"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Static front-end (everything in ./public is served automatically).
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database binding. `database_id` is blank in the template — create your
# database first (dashboard or `wrangler d1 create`), then paste the id here.
[[d1_databases]]
binding = "DB"
database_name = "harbury-project-template-db"
database_id = "9188f71e-ba11-42f0-ae95-cc926f1a2d26"
